<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENCCO - Conector SIRE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { width: 340px; background: #f8fafc; color: #0f172a; padding: 14px; }
        .header { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .logo-circle { width: 34px; height: 34px; border-radius: 50%; background: #15803d; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
        .header-title h1 { font-size: 13px; font-weight: 800; color: #0f2b5c; }
        .header-title p { font-size: 10px; color: #64748b; }
        
        .status-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .status-sire { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .status-encco { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .status-other { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }

        .btn { width: 100%; border: none; padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; transition: transform 0.15s, opacity 0.15s; }
        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-extract { background: #0284c7; color: #ffffff; }
        .btn-send { background: #15803d; color: #ffffff; }
        .btn-copy { background: #ffffff; color: #334155; border: 1px solid #cbd5e1; }

        .preview-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 11px; margin-top: 10px; max-height: 140px; overflow-y: auto; }
        .preview-box strong { color: #0f2b5c; }
        .preview-item { margin-bottom: 4px; display: flex; justify-content: space-between; border-bottom: 1px dashed #f1f5f9; padding-bottom: 2px; }
        .preview-empty { color: #94a3b8; text-align: center; padding: 12px 0; }
        .footer { margin-top: 12px; text-align: center; font-size: 9px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-circle">🎓</div>
        <div class="header-title">
            <h1>ENCCO Jutiapa 1970</h1>
            <p>Conector de Expedientes SIRE MINEDUC</p>
        </div>
    </div>

    <div id="pageStatus" class="status-badge status-other">
        <span>⚪</span> Detectando pestaña activa...
    </div>

    <button id="btnExtract" class="btn btn-extract">
        📥 Extraer Alumno de Pestaña SIRE
    </button>

    <button id="btnSend" class="btn btn-send" style="display:none;">
        🚀 Enviar a Plataforma ENCCO
    </button>

    <button id="btnCopy" class="btn btn-copy" style="display:none;">
        📋 Copiar Ficha al Portapapeles
    </button>

    <div class="preview-box" id="previewContainer">
        <div class="preview-empty">Ningún alumno en memoria.<br>Abra un expediente en SIRE y pulse "Extraer".</div>
    </div>

    <div class="footer">
        Conector Oficial v1.0 • ENCCO Jutiapa
    </div>

    <script src="popup.js"></script>
</body>
</html>
